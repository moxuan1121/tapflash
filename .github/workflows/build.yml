name: Build RootHide arm64e package

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install RootHide Theos, toolchain, and SDK
        env:
          CI: "true"
          THEOS: ${{ github.workspace }}/theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Build RootHide package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: tapflash-roothide-arm64e
          path: packages/*.deb
          if-no-files-found: error
